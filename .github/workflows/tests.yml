name: Local media and GTK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install local media and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 imagemagick
      - name: Real encoding and failure-path tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Syntax and launcher checks
        run: |
          /usr/bin/python3 -m compileall -q a2v tests scripts
          sh -n audio2video install-deps.sh
          ./audio2video doctor
      - name: Build and verify the committed package
        run: |
          /usr/bin/python3 scripts/package.py
          /usr/bin/python3 tests/package_roundtrip.py
          (cd dist && sha256sum -c *.sha256)
          mkdir packaged
          tar -xzf dist/Audio-To-Video-*-linux.tar.gz -C packaged
      - name: Packaged native GTK interaction and real exports
        working-directory: packaged/Audio-To-Video-0.1.0-preview
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a -s '-screen 0 1280x1000x24' dbus-run-session -- /usr/bin/python3 tests/gtk_smoke.py --screenshots "$GITHUB_WORKSPACE/artifacts"
      - name: Preserve runnable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio2video-linux
          path: dist/Audio-To-Video-*-linux.tar.gz*
          if-no-files-found: error
          compression-level: 0
      - name: Preserve native GTK screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtk-layouts
          path: artifacts/*.png
          if-no-files-found: ignore
